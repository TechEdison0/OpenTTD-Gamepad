name: CI - Desktop

on:
  pull_request:
  push:
    branches:
    - main
    - 1.x

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          liballegro4-dev \
          libcurl4-openssl-dev \
          libfontconfig-dev \
          libharfbuzz-dev \
          libicu-dev \
          liblzma-dev \
          liblzo2-dev \
          libogg-dev \
          libopus-dev \
          libopusfile-dev \
          libsoxr-dev \
          libsdl2-dev \
          zlib1g-dev

    - name: Setup vcpkg (breakpad only)
      run: |
        git clone https://github.com/microsoft/vcpkg.git "${RUNNER_TEMP}/vcpkg"
        "${RUNNER_TEMP}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        # Use system libraries; only breakpad comes from vcpkg.
        mv vcpkg.json vcpkg-disabled.json
        "${RUNNER_TEMP}/vcpkg/vcpkg" install breakpad

    - name: Build
      run: |
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE="${RUNNER_TEMP}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
        cmake --build build -j "$(nproc)"

    - name: Get OpenGFX
      run: |
        mkdir -p ~/.local/share/openttd/baseset
        cd ~/.local/share/openttd/baseset

        echo "::group::Download OpenGFX"
        curl -L https://cdn.openttd.org/opengfx-releases/0.6.0/opengfx-0.6.0-all.zip -o opengfx-all.zip
        echo "::endgroup::"

        echo "::group::Unpack OpenGFX"
        unzip opengfx-all.zip
        echo "::endgroup::"

        rm -f opengfx-all.zip

    - name: Test
      run: ctest --test-dir build -j "$(nproc)" --timeout 120
